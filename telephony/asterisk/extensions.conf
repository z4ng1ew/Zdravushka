[general]
static = yes
writeprotect = yes

; Входящий звонок с софтфона на 049 -> Здравушка (AudioSocket на 127.0.0.1:9092)
[from-gateway]
exten => 049,1,Answer()
 same => n,Set(CALL_ID=${SHELL(cat /proc/sys/kernel/random/uuid):0:36})
 same => n,AudioSocket(${CALL_ID},127.0.0.1:9092)
 same => n,Hangup()

; Исходящий звонок-напоминание на софтфон команды
[reminders]
exten => call,1,Dial(PJSIP/phone-049@gateway,45)
 same => n,Hangup()

; Пациент взял трубку -> тоже Здравушка
[reminder-answered]
exten => s,1,Answer()
 same => n,Set(CALL_ID=${SHELL(cat /proc/sys/kernel/random/uuid):0:36})
 same => n,AudioSocket(${CALL_ID},127.0.0.1:9092)
 same => n,Hangup()
