; SIP для Здравушки: софтфон (Linphone / Zoiper) регистрируется как пользователь «patient»
; и звонит на номер 100. Пароль поменяйте и НЕ коммитьте настоящий.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[patient]
type=endpoint
context=zdravushka
disallow=all
allow=ulaw,alaw
auth=patient-auth
aors=patient
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[patient-auth]
type=auth
auth_type=userpass
username=patient
password=CHANGE_ME

[patient]
type=aor
max_contacts=5
